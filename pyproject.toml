[project]
name = "nextset"
version = "1.0.0"
description = "A curated DJ set, one click away. FastAPI and Google Sheets."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

